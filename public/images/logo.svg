<svg width="120" height="90" viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ghcMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28C76F" />
      <stop offset="100%" stop-color="#1D9D56" />
    </linearGradient>
    <linearGradient id="ghcGoldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ghcDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0D3B2E" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- PHỤ KIỆN 2: Vương miện vàng nghiêng trên đầu chữ C -->
  <g transform="translate(85, 8) rotate(16)">
    <rect x="-1" y="16" width="22" height="3" rx="1.5" fill="#D97706" />
    <path d="M0 16 L2 4 L7 10 L10 1 L13 10 L18 4 L20 16 Z" fill="url(#ghcGoldCrown)" filter="url(#ghcDropShadow)" />
    <circle cx="2" cy="4" r="1.5" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5" />
    <circle cx="10" cy="1" r="1.8" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5" />
    <circle cx="18" cy="4" r="1.5" fill="#FFFBEB" stroke="#D97706" stroke-width="0.5" />
  </g>

  <!-- CHỦ THỂ: Chữ GHC -->
  <text x="6" y="56" font-family="Manrope, system-ui, sans-serif" font-size="48" font-weight="900" fill="#0D3B2E" letter-spacing="-0.04em">G</text>
  <text x="38" y="56" font-family="Manrope, system-ui, sans-serif" font-size="48" font-weight="900" fill="#0D3B2E" letter-spacing="-0.04em">H</text>
  <text x="73" y="56" font-family="Manrope, system-ui, sans-serif" font-size="48" font-weight="900" fill="url(#ghcMintGrad)" letter-spacing="-0.04em">C</text>

  <!-- PHỤ KIỆN 1: Chiếc xe tải nhỏ chạy dưới chân chủ thể GHC -->
  <g transform="translate(18, 64)">
    <line x1="-12" y1="20" x2="80" y2="20" stroke="#6B8679" stroke-width="1.5" stroke-dasharray="6 3" stroke-opacity="0.4" />
    <line x1="-8" y1="11" x2="6" y2="11" stroke="#28C76F" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="-14" y1="15" x2="2" y2="15" stroke="#28C76F" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
    <rect x="8" y="2" width="28" height="15" rx="2" fill="#0D3B2E" />
    <rect x="12" y="6" width="7" height="6" rx="1" fill="#28C76F" opacity="0.9" />
    <path d="M36 7 L45 7 L49 12 L49 17 L36 17 Z" fill="#28C76F" />
    <path d="M38 9 L44 9 L47 12 L38 12 Z" fill="#F3FAF5" />
    <circle cx="48" cy="14" r="1" fill="#FBBF24" />
    <circle cx="16" cy="18" r="4" fill="#0D3B2E" />
    <circle cx="16" cy="18" r="2" fill="#F3FAF5" />
    <circle cx="43" cy="18" r="4" fill="#0D3B2E" />
    <circle cx="43" cy="18" r="2" fill="#F3FAF5" />
  </g>
</svg>

