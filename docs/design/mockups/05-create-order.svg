  <rect x="168" y="248" width="460" height="42" rx="10" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="184" y="274" fill="#0D3B2E" font-size="13">Chuột không dây (prod_01)</text>
  <rect x="644" y="248" width="120" height="42" rx="10" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="664" y="274" fill="#0D3B2E" font-size="13">2</text>
  <rect x="780" y="248" width="172" height="42" rx="10" fill="#F3FAF5" stroke="#28C76F"/>
  <text x="866" y="274" text-anchor="middle" fill="#0D3B2E" font-size="12" font-weight="600">+ Thêm dòng sản phẩm</text>

  <line x1="168" y1="316" x2="952" y2="316" stroke="#6B8679" stroke-opacity="0.2"/>
  <text x="168" y="348" fill="#0D3B2E" font-size="15" font-weight="700">Bước 2: Thông tin người nhận và địa chỉ giao</text>
  <rect x="168" y="364" width="380" height="42" rx="10" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="184" y="390" fill="#6B8679" font-size="13">Tên người nhận (tối đa 100 ký tự)</text>
  <rect x="564" y="364" width="388" height="42" rx="10" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="580" y="390" fill="#6B8679" font-size="13">Số điện thoại (10 chữ số, bắt đầu bằng 0)</text>
  <rect x="168" y="420" width="784" height="42" rx="10" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
