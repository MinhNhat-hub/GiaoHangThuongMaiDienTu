<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="Manrope, Segoe UI, Arial, sans-serif">
  <rect width="1120" height="660" fill="#F3FAF5"/>
  <rect x="0" y="0" width="1120" height="64" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.2"/>
  <text x="32" y="38" fill="#0D3B2E" font-size="16" font-weight="700">GHC Delivery</text>
  <text x="220" y="36" fill="#0D3B2E" font-size="12" font-weight="600">Đơn hàng</text>
  <text x="308" y="36" fill="#0D3B2E" font-size="12" font-weight="600">Hoàn hàng</text>
  <rect x="1008" y="18" width="84" height="30" rx="8" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="1050" y="37" text-anchor="middle" fill="#BE123C" font-size="12" font-weight="600">Đăng xuất</text>

  <rect x="140" y="88" width="840" height="84" rx="16" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.2"/>
