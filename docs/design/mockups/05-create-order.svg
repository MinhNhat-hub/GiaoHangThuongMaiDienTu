  <text x="168" y="150" fill="#6B8679" font-size="12">Bước 1: Chọn sản phẩm &amp; số lượng  →  Bước 2: Thông tin người nhận  →  Bước 3: Xem lại &amp; xác nhận</text>

  <rect x="140" y="192" width="840" height="412" rx="16" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.2"/>
