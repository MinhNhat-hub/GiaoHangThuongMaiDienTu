  <text x="280" y="308" fill="#0D3B2E" font-size="12" font-weight="600">EMAIL *</text>
  <rect x="280" y="316" width="400" height="42" rx="12" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="296" y="342" fill="#6B8679" font-size="13">customer@example.com (tối đa 254 ký tự)</text>

  <text x="280" y="384" fill="#0D3B2E" font-size="12" font-weight="600">MẬT KHẨU *</text>
  <rect x="280" y="392" width="400" height="42" rx="12" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="296" y="418" fill="#6B8679" font-size="13">8 đến 64 ký tự</text>

  <rect x="280" y="464" width="400" height="46" rx="12" fill="#28C76F"/>
  <text x="480" y="492" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">Đăng ký</text>

  <line x1="280" y1="538" x2="680" y2="538" stroke="#6B8679" stroke-opacity="0.2"/>
