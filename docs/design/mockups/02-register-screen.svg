<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Manrope, Segoe UI, Arial, sans-serif">
  <rect width="960" height="660" fill="#F3FAF5"/>
  <rect x="240" y="40" width="480" height="572" rx="20" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.25"/>
  <text x="480" y="92" text-anchor="middle" fill="#0D3B2E" font-size="24" font-weight="700">Đăng ký</text>
  <text x="480" y="114" text-anchor="middle" fill="#6B8679" font-size="12">Tạo tài khoản Customer mới</text>

  <text x="280" y="156" fill="#0D3B2E" font-size="12" font-weight="600">HỌ TÊN *</text>
  <rect x="280" y="164" width="400" height="42" rx="12" fill="#FFFFFF" stroke="#6B8679" stroke-opacity="0.4"/>
  <text x="296" y="190" fill="#6B8679" font-size="13">Nguyễn Văn A (tối đa 100 ký tự)</text>

